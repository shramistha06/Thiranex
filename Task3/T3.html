
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Shramistha Gupta">
    <meta name="description" content="Shramistha Gupta's interactive task manager for organizing daily tasks.">
    <title>Task Manager | Shramistha Gupta</title>

    <style>
        :root {
            color-scheme: light;
            --bg: #f3f5fb;
            --card: #ffffff;
            --text: #202944;
            --muted: #69748c;
            --primary: #645bdf;
            --primary-hover: #5147c6;
            --border: #e0e5ef;
            --danger: #d93653;
            --success: #14856a;
            --shadow: 0 16px 50px rgba(34, 44, 85, 0.09);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            background:
                radial-gradient(circle at top left, #e5e2ff, transparent 35%),
                var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        button,
        input {
            font: inherit;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid #e39b21;
            outline-offset: 3px;
        }

        .app {
            width: min(100%, 720px);
            margin: 0 auto;
        }

        .profile {
            margin-bottom: 24px;
            text-align: center;
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            border-radius: 20px;
            background: var(--primary);
            color: white;
            font-size: 25px;
            font-weight: 800;
            box-shadow: var(--shadow);
        }

        .profile h1 {
            margin: 0;
            font-size: clamp(25px, 5vw, 36px);
            letter-spacing: -1px;
        }

        .profile p {
            margin: 5px 0 0;
            color: var(--muted);
        }

        .card {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--card);
            box-shadow: var(--shadow);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 22px;
            border-bottom: 1px solid var(--border);
        }

        .stat {
            padding: 14px 8px;
            border-radius: 14px;
            background: var(--bg);
            text-align: center;
        }

        .stat strong {
            display: block;
            font-size: 25px;
        }

        .stat span {
            color: var(--muted);
            font-size: 13px;
        }

        .add-section {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .add-section h2 {
            margin: 0 0 14px;
            font-size: 19px;
        }

        .add-form {
            display: flex;
            gap: 10px;
        }

        .add-form input {
            width: 100%;
            min-width: 0;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
        }

        .primary-button {
            flex-shrink: 0;
            padding: 12px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-button:hover {
            background: var(--primary-hover);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            padding: 20px 24px 10px;
        }

        .toolbar h2 {
            margin: 0;
            font-size: 19px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-button {
            padding: 7px 12px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .filter-button[aria-pressed="true"] {
            border-color: var(--border);
            background: var(--bg);
            color: var(--primary);
            font-weight: 750;
        }

        .task-list {
            display: grid;
            gap: 10px;
            padding: 14px 24px 24px;
            margin: 0;
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: border-color 160ms ease;
        }

        .task-item:hover {
            border-color: var(--primary);
        }

        .task-check {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            display: block;
            overflow-wrap: anywhere;
            font-weight: 600;
        }

        .task-item.completed .task-title {
            color: var(--muted);
            text-decoration: line-through;
        }

        .task-meta {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .task-actions {
            display: flex;
            flex-shrink: 0;
            gap: 5px;
        }

        .icon-button {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
        }

        .icon-button:hover {
            background: var(--bg);
        }

        .delete-button {
            color: var(--danger);
        }

        .empty-state {
            padding: 30px 15px;
            color: var(--muted);
            text-align: center;
        }

        .empty-state strong {
            display: block;
            margin-bottom: 5px;
            color: var(--text);
            font-size: 17px;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
        }

        .bottom-bar p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        .text-button {
            padding: 6px 0;
            border: 0;
            background: transparent;
            color: var(--danger);
            font-weight: 650;
            cursor: pointer;
        }

        .text-button:disabled {
            color: var(--muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .footer {
            padding-top: 22px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 520px) {
            body {
                padding: 22px 10px;
            }

            .summary {
                gap: 7px;
                padding: 14px;
            }

            .stat strong {
                font-size: 21px;
            }

            .add-section {
                padding: 18px;
            }

            .add-form {
                flex-direction: column;
            }

            .add-form .primary-button {
                width: 100%;
            }

            .toolbar {
                align-items: flex-start;
                flex-direction: column;
                padding-inline: 18px;
            }

            .task-list {
                padding-inline: 12px;
            }

            .task-item {
                gap: 8px;
                padding: 10px;
            }

            .task-actions {
                flex-direction: column;
            }

            .bottom-bar {
                padding-inline: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header class="profile">
            <div class="avatar" aria-hidden="true">SG</div>
            <h1>Shramistha Gupta</h1>
            <p>Your personal task manager</p>
        </header>

        <section class="card" aria-label="Task management application">
            <div class="summary" aria-label="Task statistics">
                <div class="stat">
                    <strong id="total-count">0</strong>
                    <span>Total Tasks</span>
                </div>
                <div class="stat">
                    <strong id="active-count">0</strong>
                    <span>Active</span>
                </div>
                <div class="stat">
                    <strong id="completed-count">0</strong>
                    <span>Completed</span>
                </div>
            </div>

            <section class="add-section" aria-labelledby="add-title">
                <h2 id="add-title">Add a new task</h2>

                <form id="task-form" class="add-form">
                    <label for="task-input" hidden>Task description</label>
                    <input
                        id="task-input"
                        name="task"
                        type="text"
                        placeholder="What needs to be done?"
                        maxlength="200"
                        autocomplete="off"
                        required
                    >
                    <button class="primary-button" type="submit">
                        + Add Task
                    </button>
                </form>
            </section>

            <section aria-labelledby="list-title">
                <div class="toolbar">
                    <h2 id="list-title">My Tasks</h2>

                    <div class="filters" role="group" aria-label="Filter tasks">
                        <button class="filter-button" type="button"
                            data-filter="all" aria-pressed="true">
                            All
                        </button>
                        <button class="filter-button" type="button"
                            data-filter="active" aria-pressed="false">
                            Active
                        </button>
                        <button class="filter-button" type="button"
                            data-filter="completed" aria-pressed="false">
                            Completed
                        </button>
                    </div>
                </div>

                <ul id="task-list" class="task-list" aria-label="Tasks"></ul>

                <div id="empty-state" class="empty-state">
                    <strong>No tasks yet</strong>
                    Add your first task to get started.
                </div>
            </section>

            <div class="bottom-bar">
                <p id="remaining-text" aria-live="polite">0 tasks remaining</p>
                <button id="clear-completed" class="text-button" type="button">
                    Clear completed
                </button>
            </div>
        </section>

        <footer class="footer">
            <p>Designed for Shramistha Gupta · Your tasks stay in this browser.</p>
        </footer>

        <p id="app-status" role="status" aria-live="polite" class="footer"></p>
    </main>

    <script>
        "use strict";

        const STORAGE_KEY = "shramistha-todo-tasks-v1";

        const form = document.getElementById("task-form");
        const input = document.getElementById("task-input");
        const taskList = document.getElementById("task-list");
        const emptyState = document.getElementById("empty-state");
        const totalCount = document.getElementById("total-count");
        const activeCount = document.getElementById("active-count");
        const completedCount = document.getElementById("completed-count");
        const remainingText = document.getElementById("remaining-text");
        const clearCompletedButton = document.getElementById("clear-completed");
        const appStatus = document.getElementById("app-status");
        const filterButtons = document.querySelector(".filters");

        let tasks = loadTasks();
        let currentFilter = "all";

        function loadTasks() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                const parsed = saved ? JSON.parse(saved) : [];

                if (!Array.isArray(parsed)) {
                    return [];
                }

                return parsed.filter(task =>
                    task &&
                    typeof task.id === "string" &&
                    typeof task.title === "string" &&
                    typeof task.completed === "boolean"
                );
            } catch (error) {
                return [];
            }
        }

        function saveTasks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                return true;
            } catch (error) {
                announce("Unable to save tasks in this browser.");
                return false;
            }
        }

        function announce(message) {
            appStatus.textContent = message;
        }

        function createTask(title) {
            const task = {
                id: crypto.randomUUID
                    ? crypto.randomUUID()
                    : Date.now().toString(36) + Math.random().toString(36).slice(2),
                title: title,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.unshift(task);
            saveTasks();
            render();
            announce("Task added.");
        }

        function updateTask(id, changes) {
            tasks = tasks.map(task =>
                task.id === id ? { ...task, ...changes } : task
            );

            saveTasks();
            render();
        }

        function deleteTask(id) {
            const task = tasks.find(item => item.id === id);

            if (!task) {
                return;
            }

            tasks = tasks.filter(item => item.id !== id);
            saveTasks();
            render();
            announce("Task deleted.");
        }

        function getVisibleTasks() {
            if (currentFilter === "active") {
                return tasks.filter(task => !task.completed);
            }

            if (currentFilter === "completed") {
                return tasks.filter(task => task.completed);
            }

            return tasks;
        }

        function render() {
            const visibleTasks = getVisibleTasks();
            const active = tasks.filter(task => !task.completed).length;
            const completed = tasks.length - active;

            totalCount.textContent = tasks.length;
            activeCount.textContent = active;
            completedCount.textContent = completed;

            remainingText.textContent =
                active + (active === 1 ? " task remaining" : " tasks remaining");

            clearCompletedButton.disabled = completed === 0;
            taskList.replaceChildren();

            emptyState.hidden = visibleTasks.length > 0;

            if (visibleTasks.length === 0) {
                const strong = document.createElement("strong");
                const message = document.createElement("span");

                if (tasks.length === 0) {
                    strong.textContent = "No tasks yet";
                    message.textContent = "Add your first task to get started.";
                } else if (currentFilter === "active") {
                    strong.textContent = "No active tasks";
                    message.textContent = "All caught up! Nothing left to do.";
                } else if (currentFilter === "completed") {
                    strong.textContent = "No completed tasks";
                    message.textContent = "Completed tasks will appear here.";
                }

                emptyState.replaceChildren(strong, message);
            }

            visibleTasks.forEach(task => {
                const item = document.createElement("li");
                item.className = "task-item";
                item.dataset.id = task.id;

                if (task.completed) {
                    item.classList.add("completed");
                }

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "task-check";
                checkbox.checked = task.completed;
                checkbox.dataset.action = "toggle";
                checkbox.setAttribute(
                    "aria-label",
                    (task.completed ? "Mark active: " : "Complete: ") + task.title
                );

                const content = document.createElement("div");
                content.className = "task-content";

                const title = document.createElement("span");
                title.className = "task-title";
                title.textContent = task.title;

                const date = document.createElement("span");
                date.className = "task-meta";
                date.textContent = "Added " + new Date(task.createdAt || Date.now())
                    .toLocaleDateString();

                content.append(title, date);

                const actions = document.createElement("div");
                actions.className = "task-actions";

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "icon-button";
                editButton.dataset.action = "edit";
                editButton.textContent = "✎";
                editButton.setAttribute("aria-label", "Edit " + task.title);
                editButton.title = "Edit task";

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "icon-button delete-button";
                deleteButton.dataset.action = "delete";
                deleteButton.textContent = "×";
                deleteButton.setAttribute("aria-label", "Delete " + task.title);
                deleteButton.title = "Delete task";

                actions.append(editButton, deleteButton);
                item.append(checkbox, content, actions);
                taskList.appendChild(item);
            });

            filterButtons.querySelectorAll("[data-filter]").forEach(button => {
                button.setAttribute(
                    "aria-pressed",
                    String(button.dataset.filter === currentFilter)
                );
            });
        }

        form.addEventListener("submit", event => {
            event.preventDefault();

            const title = input.value.trim();

            if (!title) {
                input.focus();
                return;
            }

            if (title.length > 200) {
                announce("Task descriptions must be 200 characters or fewer.");
                return;
            }

            createTask(title);
            form.reset();
            input.focus();
        });

        filterButtons.addEventListener("click", event => {
            const button = event.target.closest("[data-filter]");

            if (!button) {
                return;
            }

            currentFilter = button.dataset.filter;
            render();
        });

        taskList.addEventListener("change", event => {
            const checkbox = event.target.closest('[data-action="toggle"]');

            if (!checkbox) {
                return;
            }

            const item = checkbox.closest("[data-id]");

            if (item) {
                updateTask(item.dataset.id, {
                    completed: checkbox.checked
                });

                announce(
                    checkbox.checked
                        ? "Task marked completed."
                        : "Task marked active."
                );
            }
        });

        taskList.addEventListener("click", event => {
            const button = event.target.closest("[data-action]");

            if (!button) {
                return;
            }

            const item = button.closest("[data-id]");

            if (!item) {
                return;
            }

            const task = tasks.find(task => task.id === item.dataset.id);

            if (!task) {
                return;
            }

            if (button.dataset.action === "delete") {
                deleteTask(task.id);
            }

            if (button.dataset.action === "edit") {
                const updatedTitle = window.prompt(
                    "Edit your task:",
                    task.title
                );

                if (updatedTitle === null) {
                    return;
                }

                const trimmedTitle = updatedTitle.trim();

                if (!trimmedTitle) {
                    announce("Task description cannot be empty.");
                    return;
                }

                if (trimmedTitle.length > 200) {
                    announce("Task descriptions must be 200 characters or fewer.");
                    return;
                }

                updateTask(task.id, { title: trimmedTitle });
                announce("Task updated.");
            }
        });

        clearCompletedButton.addEventListener("click", () => {
            const completed = tasks.filter(task => task.completed).length;

            if (completed === 0) {
                return;
            }

            tasks = tasks.filter(task => !task.completed);
            saveTasks();
            render();
            announce("Completed tasks cleared.");
        });

        render();
    </script>
</body>
</html>
